    <rect x="480" y="-30" width="500" height="510" fill="url(#grid)"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="40" y="75" fill="#69e5a9" font-size="23" letter-spacing="4">BUILD · SHIP · ITERATE</text>
      <text x="40" y="173" fill="#d5f8e5" font-size="62" font-weight="700" letter-spacing="-2">bufan1024<tspan fill="#69e5a9">_</tspan></text>
