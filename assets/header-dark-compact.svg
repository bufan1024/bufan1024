<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">bufan1024 — Build, ship, iterate</title>
  <desc id="desc">A terminal-inspired profile banner. Building tools for everyday use.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#69e5a9" stroke-width="1" opacity="0.2"/>
    </pattern>
    <clipPath id="bounds"><rect width="640" height="340" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
